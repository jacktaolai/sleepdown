<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Import Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex justify-center w-full">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-xl">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center justify-between p-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Import Schedule</h2>
</div>
<div class="flex-1 overflow-y-auto px-4 pb-8">
<!-- Primary Method: School Sync -->
<section class="mt-2 mb-8">
<h3 class="text-slate-900 dark:text-white tracking-tight text-xl font-bold leading-tight mb-2">Sync from School System</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal leading-normal mb-4">Connect your student portal to automatically import your courses, times, and locations.</p>
<div class="bg-white dark:bg-[#1c2630] rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-800">
<div class="flex flex-col gap-4">
<div class="flex items-center gap-3 mb-1">
<div class="flex items-center justify-center size-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">school</span>
</div>
<div class="flex flex-col">
<span class="text-slate-900 dark:text-white font-semibold">Find your institution</span>
<span class="text-xs text-slate-500 dark:text-slate-400">Supported in 20+ countries</span>
</div>
</div>
<!-- Search Input -->
<label class="relative flex w-full items-center">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="block w-full rounded-lg border-0 py-3 pl-10 pr-4 text-slate-900 ring-1 ring-inset ring-slate-200 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 dark:bg-[#111a22] dark:text-white dark:ring-slate-700 dark:focus:ring-primary" placeholder="Search university or college..." type="text"/>
</label>
<div class="flex flex-wrap gap-2 mt-1">
<button class="px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                Harvard
                            </button>
<button class="px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                MIT
                            </button>
<button class="px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                Stanford
                            </button>
</div>
</div>
</div>
</section>
<!-- Other Methods -->
<section>
<h3 class="text-slate-900 dark:text-white tracking-tight text-xl font-bold leading-tight mb-4">Other Import Methods</h3>
<div class="grid grid-cols-1 gap-4">
<!-- File Import Card -->
<button class="group relative flex w-full flex-col overflow-hidden rounded-xl bg-white dark:bg-[#1c2630] shadow-sm border border-slate-200 dark:border-slate-800 transition-all hover:border-primary/50 dark:hover:border-primary/50 text-left">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl text-primary">upload_file</span>
</div>
<div class="p-5 flex items-start gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined text-2xl">table_view</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Upload File</h4>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Import from Excel (.xlsx) or Calendar file (.ics)</p>
</div>
</div>
</button>
<!-- Manual Input Card -->
<button class="group relative flex w-full flex-col overflow-hidden rounded-xl bg-white dark:bg-[#1c2630] shadow-sm border border-slate-200 dark:border-slate-800 transition-all hover:border-primary/50 dark:hover:border-primary/50 text-left">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl text-primary">edit_calendar</span>
</div>
<div class="p-5 flex items-start gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400">
<span class="material-symbols-outlined text-2xl">add</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Manual Input</h4>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Create your schedule from scratch, one class at a time.</p>
</div>
</div>
</button>
<!-- Scan Image Card (Extra option for completeness) -->
<button class="group relative flex w-full flex-col overflow-hidden rounded-xl bg-white dark:bg-[#1c2630] shadow-sm border border-slate-200 dark:border-slate-800 transition-all hover:border-primary/50 dark:hover:border-primary/50 text-left">
<div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-6xl text-primary">document_scanner</span>
</div>
<div class="p-5 flex items-start gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg bg-purple-500/10 text-purple-600 dark:text-purple-400">
<span class="material-symbols-outlined text-2xl">photo_camera</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Scan Timetable</h4>
<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Take a photo of your paper schedule.</p>
</div>
</div>
</button>
</div>
</section>
<div class="mt-8 flex justify-center">
<a class="text-xs text-primary font-medium hover:underline flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">help</span>
                    Having trouble? View guide
                </a>
</div>
<div class="h-10"></div> <!-- Bottom Spacer -->
</div>
</div>
</body></html>
