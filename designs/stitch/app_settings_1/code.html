<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>App Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-container": "#233648", 
                        "on-primary-container": "#d1e4ff",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#182430",
                        "surface-variant-dark": "#1e2b38",
                        "outline-variant": "#43474e",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit to match dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #101922; 
        }
        ::-webkit-scrollbar-thumb {
            background: #43474e; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5e66; 
        }
        
        /* Material 3 Ripple effect simulation */
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple:after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active:after {
            transform: scale(0, 0);
            opacity: 0.1;
            transition: 0s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased min-h-screen flex flex-col">
<!-- iOS Status Bar Placeholder -->
<div class="h-11 w-full bg-background-light dark:bg-background-dark shrink-0"></div>
<!-- Top App Bar (Material 3 Center Aligned) -->
<header class="flex items-center justify-between px-4 py-3 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button class="flex items-center justify-center p-3 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors ripple text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="text-xl font-medium tracking-normal text-slate-900 dark:text-slate-100">Settings</h1>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 px-4 py-2 w-full max-w-md mx-auto">
<!-- Section Title (Optional for grouping, mimics iOS grouped table headers) -->
<div class="px-4 py-2 mt-2">
<h2 class="text-sm font-medium text-primary dark:text-primary uppercase tracking-wider">General</h2>
</div>
<!-- Settings Group Container (Material 3 Surface Container) -->
<div class="flex flex-col bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-800">
<!-- List Item: Time Settings -->
<div class="relative group">
<button class="flex items-center w-full p-4 gap-4 text-left hover:bg-slate-50 dark:hover:bg-surface-variant-dark transition-colors ripple">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-100 dark:bg-primary-container text-primary dark:text-on-primary-container shrink-0">
<span class="material-symbols-outlined text-[20px]">calendar_month</span>
</div>
<div class="flex flex-col flex-1">
<span class="text-base font-medium text-slate-900 dark:text-slate-100 leading-snug">Time Settings</span>
<span class="text-sm text-slate-500 dark:text-slate-400 leading-snug mt-0.5">Configure period durations</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">chevron_right</span>
</button>
<div class="absolute bottom-0 left-[72px] right-0 h-[1px] bg-slate-100 dark:bg-slate-800"></div>
</div>
<!-- List Item: Appearance -->
<div class="relative group">
<button class="flex items-center w-full p-4 gap-4 text-left hover:bg-slate-50 dark:hover:bg-surface-variant-dark transition-colors ripple">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-purple-100 dark:bg-[#342a3b] text-purple-600 dark:text-[#e8def8] shrink-0">
<span class="material-symbols-outlined text-[20px]">palette</span>
</div>
<div class="flex flex-col flex-1">
<span class="text-base font-medium text-slate-900 dark:text-slate-100 leading-snug">Appearance</span>
<span class="text-sm text-slate-500 dark:text-slate-400 leading-snug mt-0.5">Theme, Color scheme</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">chevron_right</span>
</button>
<div class="absolute bottom-0 left-[72px] right-0 h-[1px] bg-slate-100 dark:bg-slate-800"></div>
</div>
<!-- List Item: Notifications -->
<div class="relative group">
<button class="flex items-center w-full p-4 gap-4 text-left hover:bg-slate-50 dark:hover:bg-surface-variant-dark transition-colors ripple">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-amber-100 dark:bg-[#3b3425] text-amber-600 dark:text-[#ffdf9e] shrink-0">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</div>
<div class="flex flex-col flex-1">
<span class="text-base font-medium text-slate-900 dark:text-slate-100 leading-snug">Notifications</span>
<span class="text-sm text-slate-500 dark:text-slate-400 leading-snug mt-0.5">Class reminders, Alerts</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Section Title -->
<div class="px-4 py-2 mt-6">
<h2 class="text-sm font-medium text-primary dark:text-primary uppercase tracking-wider">Support</h2>
</div>
<!-- Settings Group Container (Secondary) -->
<div class="flex flex-col bg-white dark:bg-surface-dark rounded-2xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-800">
<!-- List Item: About -->
<div class="relative group">
<button class="flex items-center w-full p-4 gap-4 text-left hover:bg-slate-50 dark:hover:bg-surface-variant-dark transition-colors ripple">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 shrink-0">
<span class="material-symbols-outlined text-[20px]">info</span>
</div>
<div class="flex flex-col flex-1">
<span class="text-base font-medium text-slate-900 dark:text-slate-100 leading-snug">About</span>
<span class="text-sm text-slate-500 dark:text-slate-400 leading-snug mt-0.5">Version, Legal, Help</span>
</div>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 text-[20px]">chevron_right</span>
</button>
</div>
</div>
<!-- Footer Info -->
<div class="mt-8 mb-10 flex flex-col items-center justify-center opacity-40">
<span class="text-xs text-slate-500 dark:text-slate-400">Timetable App v2.4.1 (Build 204)</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Made for Students</span>
</div>
</main>
<!-- Bottom Navigation Bar (Contextual Placeholder for App) -->
<nav class="sticky bottom-0 w-full bg-background-light dark:bg-surface-dark border-t border-slate-200 dark:border-slate-800 pb-6 pt-2 px-6 flex justify-between items-center z-50">
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="text-[10px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-slate-400 dark:text-slate-500 hover:text-primary dark:hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">calendar_today</span>
<span class="text-[10px] font-medium">Schedule</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 text-primary dark:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px] fill-current">settings</span>
<span class="text-[10px] font-medium">Settings</span>
</button>
</nav>
</body></html>
