<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Modern MD3 Add Course Final Refinement</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "md-sys-color-primary": "#0061a4",
                        "md-sys-color-on-primary": "#ffffff",
                        "md-sys-color-primary-container": "#d1e4ff",
                        "md-sys-color-on-primary-container": "#001d36",
                        "md-sys-color-secondary": "#535f70",
                        "md-sys-color-on-secondary": "#ffffff",
                        "md-sys-color-secondary-container": "#d7e3f7",
                        "md-sys-color-on-secondary-container": "#101c2b",
                        "md-sys-color-tertiary": "#6b5778",
                        "md-sys-color-on-tertiary": "#ffffff",
                        "md-sys-color-tertiary-container": "#f2daff",
                        "md-sys-color-on-tertiary-container": "#251431",
                        "md-sys-color-error": "#ba1a1a",
                        "md-sys-color-on-error": "#ffffff",
                        "md-sys-color-error-container": "#ffdad6",
                        "md-sys-color-on-error-container": "#410002",
                        "md-sys-color-surface": "#fdfcff", 
                        "md-sys-color-surface-container-low": "#f6f8fc", 
                        "md-sys-color-surface-container": "#f0f4f9",
                        "md-sys-color-on-surface": "#1a1c1e",
                        "md-sys-color-surface-variant": "#dfe2eb",
                        "md-sys-color-on-surface-variant": "#43474e",
                        "md-sys-color-outline": "#73777f",
                        "md-sys-color-outline-variant": "#c3c7cf",
                    },
                    fontFamily: {
                        "display": ["Roboto", "Noto Sans SC", "sans-serif"],
                        "body": ["Roboto", "Noto Sans SC", "sans-serif"],
                    },
                    borderRadius: {
                        'lg': '8px', 
                        'xl': '12px',
                        '2xl': '16px',
                        '3xl': '24px',
                        'full': '9999px',
                    },
                    boxShadow: {
                        'elevation-1': '0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15)',
                        'elevation-2': '0px 1px 2px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15)',
                        'elevation-3': '0px 1px 3px 0px rgba(0, 0, 0, 0.3), 0px 4px 8px 3px rgba(0, 0, 0, 0.15)',
                        'fab': '0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.3)',
                    }
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active::after {
            transform: scale(0, 0);
            opacity: 0.1;
            transition: 0s;
        }.md3-filled-field-container {
            position: relative;
            background-color: #f0f4f9; 
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            transition: background-color 0.2s;
        }
        .md3-filled-field-container:hover {
            background-color: #e2e7ee;
        }
        .md3-filled-field-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #73777f; 
            transition: height 0.2s, background-color 0.2s;
        }
        .md3-filled-field-input:focus ~ .md3-filled-field-container::after,
        .md3-filled-field-container:focus-within::after {
            height: 2px;
            background-color: #0061a4; 
        }
        .md3-filled-field-input {
            width: 100%;
            height: 56px;
            padding: 24px 16px 8px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 24px;
            color: #1a1c1e;
            caret-color: #0061a4;
        }
        .md3-filled-field-label {
            position: absolute;
            left: 16px;
            top: 16px;
            font-size: 16px;
            line-height: 24px;
            color: #43474e;
            pointer-events: none;
            transition: all 0.2s ease-out;
            transform-origin: top left;
        }
        .md3-filled-field-input:focus ~ .md3-filled-field-label,
        .md3-filled-field-input:not(:placeholder-shown) ~ .md3-filled-field-label {
            top: 8px;
            font-size: 12px;
            line-height: 16px;
            color: #0061a4;
        }
        .md3-filled-field-input:not(:focus):not(:placeholder-shown) ~ .md3-filled-field-label {
            color: #43474e;
        }.slot-card {
            transition: all 0.3s cubic-bezier(0.2, 0.0, 0, 1.0);
        }
        .slot-card:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 8px 3px rgba(0, 0, 0, 0.15);
        }.input-chip {
            background-color: transparent;
            border: 1px solid #73777f;
            color: #1a1c1e;
            transition: all 0.2s;
        }
        .input-chip:active, .input-chip.active {
            background-color: #d1e4ff;
            border-color: transparent;
            color: #001d36;
        }
        body {
            background-color: #f6f8fc;min-height: 100vh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-md-sys-color-on-surface antialiased overflow-hidden">

</button>

</div>

                保存
            </button>

</div>
<button class="w-10 h-10 rounded-full bg-[#d1e4ff] hover:shadow-elevation-1 ripple shrink-0 transition-all active:scale-95"></button>

</div>
</div>
</div>
