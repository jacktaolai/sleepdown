<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Course Light Chinese</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CDB",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#D7E2FF",
                        "on-primary-container": "#001B3F",
                        "background": "#FDFBFF",
                        "surface": "#FDFBFF",
                        "surface-variant": "#E1E2EC",
                        "on-surface": "#1A1C1E",
                        "on-surface-variant": "#44474F",
                        "outline": "#75777F",
                        "input-bg": "#FFFFFF",
                    },
                    fontFamily: {
                        "display": ["Noto Sans SC", "Lexend", "sans-serif"],
                        "sans": ["Noto Sans SC", "Lexend", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px" },
                    boxShadow: {
                        'elevation-1': '0 1px 2px rgba(0,0,0,0.1), 0 1px 1px rgba(0,0,0,0.06)',
                        'elevation-2': '0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06)',
                    }
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }.floating-input:placeholder-shown + .floating-label {
            transform: translateY(0);
            font-size: 1rem;
            color: #75777F;
            top: 1rem;
        }
        .floating-input:focus + .floating-label,
        .floating-input:not(:placeholder-shown) + .floating-label {
            transform: translateY(-1.4rem) scale(0.85);
            color: #006CDB;
            top: 1rem;
            background-color: #FDFBFF; 
            padding: 0 4px;
        }
        .floating-input:not(:focus):not(:placeholder-shown) + .floating-label {
            color: #44474F;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-display text-on-surface min-h-screen flex flex-col antialiased">
<header class="sticky top-0 z-50 bg-surface/95 backdrop-blur-md border-b border-surface-variant/50 transition-colors">
<div class="flex items-center justify-between px-4 h-14">
<button class="flex items-center text-on-surface-variant hover:text-on-surface transition-colors p-2 -ml-2 rounded-full active:bg-surface-variant/30">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="text-lg font-medium text-center flex-1 truncate px-2 text-on-surface">添加课程</h1>
<button class="flex items-center justify-end font-medium text-primary hover:text-primary/80 transition-colors px-2 py-1 rounded-full active:bg-primary/10">
            保存
        </button>
</div>
</header>
<main class="flex-1 w-full max-w-lg mx-auto p-4 space-y-6">
<section class="space-y-5 bg-white rounded-3xl p-1">
<div class="relative group">
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant pointer-events-none z-10">
<span class="material-symbols-outlined text-[24px]">menu_book</span>
</span>
<input class="floating-input block w-full pl-12 pr-4 py-4 bg-transparent border border-outline rounded-[4px] text-on-surface placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all peer" id="course-name" placeholder="课程名称" type="text"/>
<label class="floating-label absolute left-10 pointer-events-none transition-all duration-200 origin-[0] bg-background" for="course-name">
                    课程名称
                </label>
</div>
</div>
<div class="relative group">
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant pointer-events-none z-10">
<span class="material-symbols-outlined text-[24px]">location_on</span>
</span>
<input class="floating-input block w-full pl-12 pr-4 py-4 bg-transparent border border-outline rounded-[4px] text-on-surface placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all peer" id="location" placeholder="教室地点" type="text"/>
<label class="floating-label absolute left-10 pointer-events-none transition-all duration-200 origin-[0] bg-background" for="location">
                    教室地点
                </label>
</div>
</div>
<div class="relative group">
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant pointer-events-none z-10">
<span class="material-symbols-outlined text-[24px]">person</span>
</span>
<input class="floating-input block w-full pl-12 pr-4 py-4 bg-transparent border border-outline rounded-[4px] text-on-surface placeholder-transparent focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all peer" id="teacher" placeholder="任课老师" type="text"/>
<label class="floating-label absolute left-10 pointer-events-none transition-all duration-200 origin-[0] bg-background" for="teacher">
                    任课老师
                </label>
</div>
</div>
</section>
<section>
<h2 class="text-sm font-medium text-primary mb-2 ml-1">上课时间</h2>
<div class="bg-surface-variant/30 rounded-2xl overflow-hidden border border-surface-variant/50">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant/50 transition-colors group">
<div class="flex items-center gap-4">
<div class="size-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined">schedule</span>
</div>
<div class="flex flex-col items-start">
<p class="text-base font-medium text-on-surface">选择时间</p>
<p class="text-sm text-on-surface-variant">周一 1-2节 (1-16周)</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">chevron_right</span>
</button>
</div>
</section>
<section>
<h2 class="text-sm font-medium text-primary mb-2 ml-1">课程颜色</h2>
<div class="bg-surface rounded-2xl border border-surface-variant/50 p-4 shadow-sm">
<div class="flex items-center gap-4 overflow-x-auto no-scrollbar pb-1 justify-between sm:justify-start">
<label class="group relative flex cursor-pointer items-center justify-center">
<input checked="" class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#006CDB] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#006CDB] ring-offset-surface transition-all"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all">check</span>
</label>
<label class="group relative flex cursor-pointer items-center justify-center">
<input class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#FF8A65] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#FF8A65] ring-offset-surface transition-all hover:opacity-90"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all">check</span>
</label>
<label class="group relative flex cursor-pointer items-center justify-center">
<input class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#81C784] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#81C784] ring-offset-surface transition-all hover:opacity-90"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all">check</span>
</label>
<label class="group relative flex cursor-pointer items-center justify-center">
<input class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#FFD54F] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#FFD54F] ring-offset-surface transition-all hover:opacity-90"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all text-black/50">check</span>
</label>
<label class="group relative flex cursor-pointer items-center justify-center">
<input class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#9575CD] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#9575CD] ring-offset-surface transition-all hover:opacity-90"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all">check</span>
</label>
<label class="group relative flex cursor-pointer items-center justify-center">
<input class="peer sr-only" name="color-picker" type="radio"/>
<div class="h-10 w-10 rounded-full bg-[#F06292] ring-2 ring-transparent peer-checked:ring-offset-2 peer-checked:ring-[#F06292] ring-offset-surface transition-all hover:opacity-90"></div>
<span class="material-symbols-outlined absolute text-white text-[20px] opacity-0 scale-50 peer-checked:opacity-100 peer-checked:scale-100 transition-all">check</span>
</label>
</div>
</div>
</section>
<div class="h-2"></div>
<button class="w-full py-3.5 px-4 rounded-full border border-outline/30 text-outline hover:bg-surface-variant/20 hover:text-on-surface-variant font-medium text-base transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">settings</span>
        高级设置
    </button>
<div class="h-8"></div>
</main>

</body></html>
