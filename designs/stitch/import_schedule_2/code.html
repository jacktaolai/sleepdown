<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>导入课表</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6", 
                        "on-primary": "#ffffff",
                        "primary-container": "#dbeafe",
                        "on-primary-container": "#1e40af",
                        "background": "#f8f9fa",
                        "surface": "#ffffff",
                        "surface-variant": "#f1f5f9",

                        'soft': '0 2px 8px -2px rgba(0, 0, 0, 0.05), 0 4px 16px -4px rgba(0, 0, 0, 0.02)',
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background font-display min-h-screen flex justify-center w-full text-on-surface">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background shadow-2xl">
<div class="sticky top-0 z-10 flex items-center justify-between px-4 py-3 bg-background/95 backdrop-blur-md">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-on-surface text-lg font-medium leading-tight tracking-tight flex-1 text-center pr-10">导入课表</h2>
</div>
<div class="flex-1 overflow-y-auto px-4 pb-8 pt-2">
<section class="mb-6">
<div class="bg-surface rounded-2xl p-5 shadow-soft border border-outline/30">
<div class="flex flex-col gap-4">
<div class="flex items-center gap-3 mb-1">
<div class="flex items-center justify-center size-10 rounded-full bg-primary-container text-on-primary-container">
<span class="material-symbols-outlined">school</span>
</div>
<div class="flex flex-col">
<span class="text-on-surface font-semibold text-lg">教务系统导入</span>
<span class="text-xs text-on-surface-variant">支持全国 2000+ 所高校</span>
</div>
</div>
<label class="relative flex w-full items-center mt-2">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">search</span>
</div>
<input class="block w-full rounded-xl border-0 py-3.5 pl-10 pr-4 bg-surface-variant/50 text-on-surface ring-0 placeholder:text-on-surface-variant/70 focus:ring-2 focus:ring-inset focus:ring-primary focus:bg-surface sm:text-sm sm:leading-6 transition-all" placeholder="搜索你的学校..." type="text"/>
</label>
<div class="flex flex-wrap gap-2 mt-1">
<button class="px-3 py-1.5 rounded-lg bg-surface-variant text-xs font-medium text-on-surface-variant hover:bg-surface-variant/80 transition-colors">
                                清华大学
                            </button>
<button class="px-3 py-1.5 rounded-lg bg-surface-variant text-xs font-medium text-on-surface-variant hover:bg-surface-variant/80 transition-colors">
                                北京大学
                            </button>
<button class="px-3 py-1.5 rounded-lg bg-surface-variant text-xs font-medium text-on-surface-variant hover:bg-surface-variant/80 transition-colors">
                                复旦大学
                            </button>
</div>
</div>
</div>
</section>
<section>
<h3 class="text-on-surface-variant text-sm font-medium leading-tight mb-4 ml-1">其他导入方式</h3>
<div class="grid grid-cols-1 gap-4">
<button class="group relative flex w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-soft border border-outline/30 transition-all active:scale-[0.98] hover:border-primary/30 text-left">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-7xl text-primary">upload_file</span>
</div>
<div class="p-5 flex items-center gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600">
<span class="material-symbols-outlined text-2xl">table_view</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-on-surface group-hover:text-primary transition-colors">文件导入 (Excel/ICS)</h4>
<p class="mt-0.5 text-xs text-on-surface-variant">支持 .xlsx 或 .ics 日历文件</p>
</div>
<div class="ml-auto text-on-surface-variant/50">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
</button>
<button class="group relative flex w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-soft border border-outline/30 transition-all active:scale-[0.98] hover:border-primary/30 text-left">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-7xl text-primary">edit_calendar</span>
</div>
<div class="p-5 flex items-center gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-amber-50 text-amber-600">
<span class="material-symbols-outlined text-2xl">add</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-on-surface group-hover:text-primary transition-colors">手动添加</h4>
<p class="mt-0.5 text-xs text-on-surface-variant">从零开始创建你的专属课表</p>
</div>
<div class="ml-auto text-on-surface-variant/50">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
</button>
<button class="group relative flex w-full flex-col overflow-hidden rounded-2xl bg-surface shadow-soft border border-outline/30 transition-all active:scale-[0.98] hover:border-primary/30 text-left">
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-7xl text-primary">document_scanner</span>
</div>
<div class="p-5 flex items-center gap-4 z-10">
<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-purple-50 text-purple-600">
<span class="material-symbols-outlined text-2xl">photo_camera</span>
</div>
<div class="flex flex-col">
<h4 class="text-base font-semibold text-on-surface group-hover:text-primary transition-colors">拍照导入</h4>
<p class="mt-0.5 text-xs text-on-surface-variant">拍摄纸质课表自动识别</p>
</div>
<div class="ml-auto text-on-surface-variant/50">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</div>
</button>
</div>
</section>
<div class="mt-8 flex justify-center pb-6">
<a class="text-xs text-primary font-medium hover:underline flex items-center gap-1.5 px-4 py-2 rounded-full hover:bg-primary-container/30 transition-colors" href="#">
<span class="material-symbols-outlined text-base">help</span>
                    遇到问题？查看帮助
                </a>
</div>
</div>
</div>
